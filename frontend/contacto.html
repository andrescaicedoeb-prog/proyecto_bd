<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — Mi Tienda</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo">Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="index.html#productos">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <div class="encabezado-principal">
      <p>¿Tienes dudas o sugerencias? Déjanos un mensaje y te responderemos pronto.</p>
    </div>

    <section class="tarjeta">
      <h2>Envíanos un Mensaje</h2>

      <form id="formularioContacto">
        <div class="fila-contacto">
          <div class="campo">
            <label for="nombreCompleto">Nombre completo:</label>
            <input type="text" id="nombreCompleto" required />
          </div>
          <div class="campo">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" required />
          </div>
        </div>

        <div class="campo">
          <label for="asunto">Asunto:</label>
          <input type="text" id="asunto" required />
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-contacto">Enviar Mensaje</button>
      </form>
    </section>

        <section class="tarjeta" style="margin-top: 25px;">
      <h2>Historial de Mensajes</h2>
     <div id="listaHistorial" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>

</html>
